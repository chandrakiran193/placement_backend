# Server Configuration
server.port=8080

# ===================================================================
# DATABASE CONFIGURATION (REPLACE PLACEHOLDERS FOR YOUR SYSTEM)
# ===================================================================
# If placement_db does not exist, createDatabaseIfNotExist=true will create it automatically.
spring.datasource.url=jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# REPLACE 'YOUR_MYSQL_USERNAME' with your MySQL username (e.g., root)
spring.datasource.username=root

# REPLACE 'YOUR_MYSQL_PASSWORD' with your MySQL password
spring.datasource.password=Rohan@New2026!

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration (Resumes, PDFs, DOCX)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Directory where resumes are stored
app.upload.dir=uploads/resumes

